<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Study Planner{% endblock %}</title>
    <!--Tailwind CSS-->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Brand Colors CSS Variables -->
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-text: #ffffff;
        }
    </style>

    <!-- Font Awesome for icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Navigation Bar-->
     <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{% if user.is_authenticated %}{% url 'timetable:home' %}{% else %}{% url 'landing' %}{% endif %}" class="text-2xl font-bold text-blue-600">
                        <i class="fas fa-graduation-cap"></i> Study Planner
                    </a>
                </div>

                <div class="flex items-center space-x-4">
                    {% if user.is_authenticated %}
                        <a href="{% url 'accounts:profile' %}" class="text-gray-700 hover:text-blue-600">
                            <i class="fas fa-user"></i> Profile
                        </a>
                        <!-- User Avatar -->
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm border-2" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-color: var(--primary-light);">
                            {{ user.get_initials }}
                        </div>
                        <a href="{% url 'accounts:logout' %}" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    {% else %}
                        <a href="{% url 'accounts:login' %}" class="text-gray-700 hover:text-blue-600">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </a>
                        <a href="{% url 'accounts:register' %}" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                            <i class="fas fa-user-plus"></i> Register
                        </a>

                    {% endif %}

                </div>

            </div>

        </div>

     </nav>

    <!-- Messages (sucess//error alerts)-->
    {% if messages %}
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
            {% for message in messages %}
                <div class="alert-message {% if message.tage == 'error' %} bg-red-100 border-red-400 text-red-700{% elif message.tags == 'success' %}bg-green-100 border-green-400 text-green-700{% else %}bg-blue-100 border-blue-400 text-blue-700{% endif %} px-4 py-3 rounded relative mb-4 border transition-opacity duration-500" role="alert">
                    <span class="block sm:inline">{{ message }}</span>
                </div>
            {% endfor %}

        </div>
    {% endif %}
    


    <!-- Main Content-->
     <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        {% block content %}
        {% endblock %}
     </main>

     <!--Footer-->
      <footer class="bg-white border-t mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-gray-600">
            <p>&copy; 2026 Student Study Planner. Built with Django 💙</p>
        </div>
    </footer>

    <!-- Auto-hide success messages after 3 seconds -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const messages = document.querySelectorAll('.alert-message');
            messages.forEach(message => {
                // Set timeout to fade out after 3 seconds
                setTimeout(() => {
                    message.style.opacity = '0';
                    // Remove from DOM after fade completes
                    setTimeout(() => {
                        message.remove();
                    }, 500);
                }, 3000);
            });
        });
    </script>

</body>

</html>
