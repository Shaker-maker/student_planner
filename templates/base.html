<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Study Planner{% endblock %}</title>
    <!--Tailwind CSS-->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FOnt Awesome for icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudfare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="bg-gray-50 min-h-screen">

    <!-- Navigation Bar-->
     <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{% url 'accounts:login' %}" class="text-2xl font-bold text-blue-600">
                        <i class="fas fa-graduation-cap"></i> Study Planner
                    </a>
                </div>

                <div class="flex items-center space-x-4">
                    {% if user.is_authenticated %}
                        <a href="{% url 'accounts:profile' %}" class="text-gray-700 hover:text-blue-600">
                            <i class="fas fa-user"></i> Profile
                        </a>
                        <a href="{% url 'accounts:logout' %}" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    {% else %}
                        <a href="{% url 'accounts:login' %}" class="text-gray-700 hover:text-blue-600">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </a>
                        <a href="{% url 'accounts:register' %}" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                            <i class="fas fa-user-plus"></i> Register
                        </a>

                    {% endif %}

                </div>

            </div>

        </div>

     </nav>

    <!-- Messages (sucess//error alerts)-->
    {% if messages %}
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
            {% for message in messages %}
                <div class="{% if message.tage == 'error' %} bg-red-100 border-red-400 text-red-700{% elif message.tags == 'success' %}bg-green-100 border-green-400 text-green-700{% else %}bg-blue-100 border-blue-400 text-blue-700{% endif %} px-4 py-3 rounded relative mb-4 border" role="alert">
                    <span class="block sm:inline">{{ message }}</span>
                </div>
            {% endfor %}

        </div>
    {% endif %}
    


    <!-- Main Content-->
     <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
     </main>

     <!--Footer-->
      <footer class="bg-white border-t mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-gray-600">
            <p>&copy; 2024 Student Study Planner. Built with Django 💙</p>
        </div>
    </footer>

</body>

</html>
