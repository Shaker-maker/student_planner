{% extends 'base.html' %}

{% block title %}Password Reset Complete - Study Planner{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-8 text-center">
        <i class="fas fa-check-circle text-green-600 text-6xl mb-4"></i>
        <h2 class="text-3xl font-bold text-gray-800 mb-4">Password Reset Complete!</h2>
        <p class="text-gray-600 mb-6">
            Your password has been successfully reset. 
            You can now login with your new password.
        </p>
        
        <a href="{% url 'accounts:login' %}" 
           class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 inline-block text-lg">
            <i class="fas fa-sign-in-alt"></i> Login Now
        </a>
    </div>
</div>
{% endblock %}
